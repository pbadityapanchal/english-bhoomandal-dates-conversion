<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Bhoomandal Architect Converter v4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bhoo-green: #1b5e20; --bhoo-gold: #ffab00; }
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .architect-card { max-width: 800px; margin: auto; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: none; overflow: hidden; }
        .header { background: var(--bhoo-green); color: white; padding: 30px; text-align: center; position: relative; }
        .swap-btn { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; background: var(--bhoo-gold); border: 4px solid #fff; border-radius: 50%; color: #000; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; z-index: 100; }
        .swap-btn:hover { transform: translateX(-50%) rotate(180deg); }
        .content { padding: 50px 30px 30px; background: #fff; }
        .res-box { display: none; margin-top: 20px; padding: 25px; border-radius: 15px; background: #e8f5e9; border-left: 10px solid var(--bhoo-green); }
        .special-day { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body onload="initApp()">

<div class="architect-card">
    <div class="header">
        <h2 id="modeTitle">Gregorian ➔ Bhoomandal</h2>
        <p class="mb-0 opacity-75">Strict Logical Architecture (Rules Followed)</p>
        <div class="swap-btn" onclick="toggleMode()">🔄</div>
    </div>

    <div class="content">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="fw-bold mb-1">Year (1 - 3000)</label>
                <select id="selYear" class="form-select" onchange="syncDateOptions()"></select>
            </div>
            <div class="col-md-4">
                <label class="fw-bold mb-1">Month</label>
                <select id="selMonth" class="form-select" onchange="syncDateOptions()"></select>
            </div>
            <div class="col-md-4">
                <label class="fw-bold mb-1">Date</label>
                <select id="selDate" class="form-select"></select>
            </div>
        </div>
        <button class="btn btn-success w-100 btn-lg mt-4 shadow-sm fw-bold" onclick="calculate()">Convert Date</button>

        <div id="results" class="res-box">
            <div class="row text-center">
                <div class="col-md-6 border-end">
                    <small class="text-muted">Gregorian Result</small>
                    <h4 id="gRes" class="text-primary fw-bold mt-1"></h4>
                </div>
                <div class="col-md-6">
                    <small class="text-muted">Bhoomandal Result</small>
                    <h4 id="bRes" class="text-success fw-bold mt-1"></h4>
                </div>
            </div>
            <hr>
            <div class="text-center">
                <div id="dayRes" class="h5 fw-bold mb-2">धार्मिक दिन: ...</div>
                <span id="weekRes" class="badge bg-dark p-2 fs-6">सप्ताह: ...</span>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Data Definitions
    const B_MONTHS = ["विवेक", "चयन", "परख", "प्रयास", "अमल", "विकास", "सुधार", "सरल", "प्रवाह", "समता", "प्रगति", "सफल", "प्रणव"];
    const G_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const B_WEEKDAYS = ["सहज", "संयम", "सहन", "संबंध", "साहस", "सृजन", "संतोष"];
    const REL_DAYS = ["रविवार", "सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
    
    // Anchor: 22 March 2026 = 01 विवेक 2083 (Sunday)
    const ANCHOR_G_MS = Date.UTC(2026, 2, 22);
    const MS_DAY = 86400000;
    let isGtoB = true;

    // Logic: Leap Check
    function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }

    function initApp() {
        const ySel = document.getElementById('selYear');
        for(let i=1; i<=3000; i++) ySel.add(new Option(i, i));
        
        // Default to Current Time based selection
        const now = new Date();
        ySel.value = now.getUTCFullYear();
        populateMonths();
        document.getElementById('selMonth').value = now.getUTCMonth();
        syncDateOptions();
        document.getElementById('selDate').value = now.getUTCDate();
    }

    function toggleMode() {
        isGtoB = !isGtoB;
        document.getElementById('modeTitle').innerText = isGtoB ? "Gregorian ➔ Bhoomandal" : "Bhoomandal ➔ Gregorian";
        populateMonths();
        syncDateOptions();
    }

    function populateMonths() {
        const mSel = document.getElementById('selMonth');
        mSel.innerHTML = "";
        const list = isGtoB ? G_MONTHS : B_MONTHS;
        list.forEach((m, i) => mSel.add(new Option(m, i)));
    }

    function syncDateOptions() {
        const y = parseInt(document.getElementById('selYear').value);
        const m = parseInt(document.getElementById('selMonth').value);
        const dSel = document.getElementById('selDate');
        const prev = dSel.value;
        dSel.innerHTML = "";
        
        let max = 28;
        if(isGtoB) {
            max = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
        } else {
            // Bhoomandal Month Logic
            if(m < 12) max = 28;
            else {
                if(y % 400 === 0) max = 30; // Case B
                else if(y % 100 === 0) max = 29; // Case C
                else max = (y % 4 === 0) ? 30 : 29; // Case A/B
            }
        }
        for(let i=1; i<=max; i++) dSel.add(new Option(i, i));
        if(prev <= max) dSel.value = prev;
    }

    function calculate() {
        const y = parseInt(document.getElementById('selYear').value);
        const m = parseInt(document.getElementById('selMonth').value);
        const d = parseInt(document.getElementById('selDate').value);
        
        let targetMs = isGtoB ? Date.UTC(y, m, d) : bhooToMs(y, m, d);
        render(targetMs);
    }

    function bhooToMs(y, m, d) {
        // Step 1: Year Logic
        const gy = y - 57;
        let daysFromEpochStart = 0;
        
        // Step 2: Calculate days in current Bhoo year
        for(let i=0; i<m; i++) {
            if(i < 12) daysFromEpochStart += 28;
        }
        daysFromEpochStart += (d - 1);
        
        // Start from 22 March of the calculated Gregorian Year
        return Date.UTC(gy, 2, 22) + (daysFromEpochStart * MS_DAY);
    }

    function render(ms) {
        document.getElementById('results').style.display = 'block';
        const date = new Date(ms);
        
        // 1. Religious Day Cycle
        let diff = Math.floor((ms - ANCHOR_G_MS) / MS_DAY);
        let rIdx = diff % 7;
        if(rIdx < 0) rIdx += 7;
        document.getElementById('dayRes').innerText = "धार्मिक दिन: " + REL_DAYS[rIdx];

        // 2. Gregorian Result
        document.getElementById('gRes').innerText = `${date.getUTCDate()} ${G_MONTHS[date.getUTCMonth()]}, ${date.getUTCFullYear()}`;

        // 3. Bhoomandal Logic
        const by = date.getUTCFullYear() + 57;
        let bDayOfYear = Math.floor((ms - Date.UTC(date.getUTCFullYear(), 2, 22)) / MS_DAY);
        
        // Handle negative days if date is before March 22
        if(bDayOfYear < 0) { /* Special logic for previous Bhoo year */ }

        let bm = 0;
        while(bm < 12 && bDayOfYear >= 28) { bDayOfYear -= 28; bm++; }
        let bd = bDayOfYear + 1;
        
        // Special Names for Month 12
        let displayDay = bd;
        if(bm === 12 && bd === 29) {
            if(isLeap(by)) displayDay = "29 - इला दिवस";
            else if(by % 100 === 0 && by % 400 !== 0) displayDay = "29 - शशि दिवस";
            else displayDay = "29 - दिवाकर दिवस";
        } else if(bm === 12 && bd === 30) {
            displayDay = "30 - प्रभाकर दिवस";
        }
        document.getElementById('bRes').innerHTML = `${displayDay} ${B_MONTHS[bm]}, ${by}`;

        // 4. Week Logic
        let wName = "उदय";
        if(bd > 28) wName = "उषा सप्ताह";
        else if(bd > 21) wName = "शिखर";
        else if(bd > 14) wName = "चरम";
        else if(bd > 7) wName = "उभार";
        
        let sDay = (bd <= 28) ? B_WEEKDAYS[(bd - 1) % 7] : "पर्व";
        document.getElementById('weekRes').innerText = `सप्ताह: ${wName} (${sDay})`;
    }
</script>
</body>
</html>
